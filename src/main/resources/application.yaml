spring:
  main:
    banner-mode: "off"
    log-startup-info: false
  application:
    name: coderdojo
  config:
    import: "optional:file:.env[.properties]"
  shell:
    interactive:
      enabled: true
# logging configuration moved to logback-spring.xml

eventbrite:
  api:
    token: ${EVENTBRITE_API_TOKEN:placeholder}
    base-url: https://www.eventbriteapi.com/v3
    organization-id: ${EVENTBRITE_ORG_ID:placeholder}
